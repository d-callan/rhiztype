name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# CI validates Rust tests and raw wasm32 compilation on every push/PR;
# deploy-pages.yml rebuilds docs/pkg automatically via wasm-pack on pushes to main.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  wasm-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p eggman-wasm --target wasm32-unknown-unknown --locked
